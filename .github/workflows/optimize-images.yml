name: Optimize site images

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tallita-site-improvements
    paths:
      - "public/images/*.jpg"
      - "public/images/*.jpeg"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert JPEG files to WebP
        id: convert
        shell: bash
        run: |
          shopt -s nullglob
          changed=0
          for image in public/images/*.jpg public/images/*.jpeg; do
            output="${image%.*}.webp"
            if [[ ! -f "$output" || "$image" -nt "$output" ]]; then
              quality=82
              if [[ "$(basename "$image")" == 02-* ]]; then quality=84; fi
              cwebp -quiet -mt -m 6 -q "$quality" "$image" -o "$output"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit optimized images
        if: steps.convert.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/*.webp
          git commit -m "chore: add optimized WebP images"
          git push
